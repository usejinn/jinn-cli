# Builds a release when a version tag (v1.2.3) arrives. This workflow is the
# only place jinn's binaries are built, and its releases are immutable. Each binary, SHA256SUMS and install.sh
# get a build provenance attestation, so anyone can check where a file came
# from: gh attestation verify FILE --repo usejinn/jinn-cli
#
# It also signs the release: Ed25519 over "jinn-cli <tag>\n" and SHA256SUMS,
# with the key in the release environment's JINN_RELEASE_KEY secret (the
# environment admits only v* tags). jinn update checks the signature against
# release-key.pem, the public half, which the binary embeds. No release goes
# out unsigned, or signed by a key other than release-key.pem's.
#
# The build is reproducible: Go is 1.25.12, the SDK is a
# published version, and the flags below leave no paths or build ids. Rebuild
# the tag with the same command and compare SHA-256s (README, "Verify").
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write      # the release
  id-token: write      # the attestations' signing identity
  attestations: write
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag, so the binary reports its version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false
      - name: Build
        env:
          GOTOOLCHAIN: local # exactly the Go above
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -buildid=" -o "dist/jinn-$os-$arch$ext" .
          done
          cp install.sh dist/
          (cd dist && sha256sum jinn-* install.sh > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Sign
        env:
          JINN_RELEASE_KEY: ${{ secrets.JINN_RELEASE_KEY }}
        run: |
          [ -n "$JINN_RELEASE_KEY" ] || { echo "JINN_RELEASE_KEY is not set: no release goes out unsigned"; exit 1; }
          umask 077
          printf '%s\n' "$JINN_RELEASE_KEY" > "$RUNNER_TEMP/key.pem"
          { printf 'jinn-cli %s\n' "$GITHUB_REF_NAME"; cat dist/SHA256SUMS; } > "$RUNNER_TEMP/signed"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$RUNNER_TEMP/signed" > "$RUNNER_TEMP/sig"
          rm "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -verify -pubin -inkey release-key.pem -rawin -in "$RUNNER_TEMP/signed" -sigfile "$RUNNER_TEMP/sig"
          base64 -w0 "$RUNNER_TEMP/sig" > dist/SHA256SUMS.sig
          echo >> dist/SHA256SUMS.sig
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      # Releases are immutable (enforced for the usejinn organisation): once
      # published, nothing in one can change. So the release is a draft until
      # every file is uploaded, then published once.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Install with:
          curl -fsSL https://github.com/usejinn/jinn-cli/releases/latest/download/install.sh | sh

          Update an installed jinn with: jinn update

          Check a file's origin with:
          gh attestation verify FILE --repo usejinn/jinn-cli"
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
